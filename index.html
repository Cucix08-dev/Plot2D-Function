<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Plotter 2D</title>
        <style>
            header {
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 30dvh;
                height: 30vh;
            }

            #title-page {
                text-align: center;
                color: rgb(15, 118, 170);
            }

            #background-body {
                width: 100vw;
                height: 100vh;
                height: 100dvh;
                padding: 0;
                margin: 0;
            }

            .container {
                display: flex;
                justify-content: center;
                align-items: center;
                justify-items: center;
            }

            /* PLOTTER */

            #container-plotter {
                height: 78%; 
                width: 100%;
                border: solid 2px rgba(128, 128, 128, 0.312);
                border-radius: 20px;
            }

            #plotter {
                width: 100%;
                height: 100%;
            }

            /* TEXT INPUT */

            #form-container {
                height: 8%;
                margin: 3% 0;
                padding: 16px;
                width: 90%;
                border: solid 2px rgb(108, 203, 250);
                border-radius: 20px;
            }
            
            #form-container:focus {
                border: solid 3px rgb(47, 115, 250);
                outline: none;
            }

            #user-function {
                width: 100%;
                height: 100%;
                font-size: clamp(1.2rem, 2vw, 1.5rem);
                border: none;
                outline: none;
            }
        </style>
    </head>

    <body class="container" id="background-body">
        
        <header class="container">
            <h1 id="title-page">Simple Plotter 2D</h1>
        </header>

        <div class="container" style="
            width: 90%;
            height: 50%;
            flex-direction: column;
            padding: 16px;
        ">

            <div class="container" id="container-plotter">
                <canvas id="plotter"></canvas>
            </div>
            <form action="" method="post" id="form-container">
                <input type="text" name="user-function" id="user-function">
                <button type="reset" id="reset-button"></button>
            </form>

        </div>

        <script src="js/script.js"></script>
        <script src="js/plot.js"></script>
    </body>

</html>
